<style>
:root{--bg:#f2efe7;--card:#fffdf8;--ink:#17312f;--muted:#6b716d;--line:#ddd8cd;--brand:#062b49;--sun:#ffdf00;--bad:#b3362b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);
  font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:0 20px 60px rgba(20,49,46,.09)}
.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:var(--brand);color:var(--sun);font-weight:900;font-size:20px}
h1{font-size:21px;margin:16px 0 6px}
p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.6}
label{display:block;margin-top:20px;font-weight:700;font-size:14px}
input{width:100%;margin-top:6px;font:inherit;font-size:16px;letter-spacing:.06em;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:15px;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{min-height:22px;margin-top:10px;color:var(--bad);font-size:13.5px;font-weight:700}
.foot{margin-top:14px;font-size:12.5px}
</style>
</head>
